limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

map $http_x_api_key $valid_api_key {
    default 0;
    "aglio-transitku-public-2026" 1;
    "jejakbandung-cf45da6b36ae9000" 1;
    "transitku-637e9facc71d864b" 1;
    "lokacerita-7a8b9c0d1e2f3a4b" 1;
}

map $http_authorization $has_bearer {
    default 0;
    "~^Bearer .+" 1;
}

server {
    listen 80;
    server_name _;
    default_type application/json;

    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-API-Key" always;

    if ($request_method = OPTIONS) {
        return 204;
    }

    location ~ ^/api/?$ {
        return 200 '{"status":"ok","service":"transitku-gateway","group":"Aglio","base_path":"/api/v1","endpoints":["/api/v1/health","/api/v1/corridors","/api/v1/stops","/api/v1/vehicles","/api/v1/crowd-reports","/api/v1/auth/login","/api/v1/auth/register","/api/v1/users"]}';
    }

    location = /api/v1/health {
        return 200 '{"status":"ok","service":"transitku-gateway","group":"Aglio"}';
    }

    location = /api/v1/auth/register {
        limit_req zone=api_limit burst=10 nodelay;
        proxy_pass http://account-service:8090/api/collections/users/records;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /api/v1/auth/login {
        limit_req zone=api_limit burst=10 nodelay;
        proxy_pass http://account-service:8090/api/collections/users/auth-with-password;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/v1/users {
        limit_req zone=api_limit burst=20 nodelay;
        if ($has_bearer = 0) {
            return 401 '{"error":"Unauthorized","message":"Sertakan header Authorization Bearer token"}';
        }

        rewrite ^/api/v1/users(.*)$ /api/collections/users/records$1 break;
        proxy_pass http://account-service:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
    }

    location /api/v1/corridors {
        limit_req zone=api_limit burst=20 nodelay;
        set $auth_ok 0;
        if ($valid_api_key = 1) { set $auth_ok 1; }
        if ($has_bearer = 1) { set $auth_ok 1; }
        if ($auth_ok = 0) {
            return 401 '{"error":"Unauthorized","message":"Sertakan header X-API-Key atau Authorization Bearer token"}';
        }

        rewrite ^/api/v1/corridors(.*)$ /api/collections/corridors/records$1 break;
        proxy_pass http://transit-service:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/v1/stops {
        limit_req zone=api_limit burst=20 nodelay;
        set $auth_ok 0;
        if ($valid_api_key = 1) { set $auth_ok 1; }
        if ($has_bearer = 1) { set $auth_ok 1; }
        if ($auth_ok = 0) {
            return 401 '{"error":"Unauthorized","message":"Sertakan header X-API-Key atau Authorization Bearer token"}';
        }

        rewrite ^/api/v1/stops(.*)$ /api/collections/stops/records$1 break;
        proxy_pass http://transit-service:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/v1/vehicles {
        limit_req zone=api_limit burst=20 nodelay;
        set $auth_ok 0;
        if ($valid_api_key = 1) { set $auth_ok 1; }
        if ($has_bearer = 1) { set $auth_ok 1; }
        if ($auth_ok = 0) {
            return 401 '{"error":"Unauthorized","message":"Sertakan header X-API-Key atau Authorization Bearer token"}';
        }

        rewrite ^/api/v1/vehicles(.*)$ /api/collections/vehicles/records$1 break;
        proxy_pass http://transit-service:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/v1/crowd-reports {
        limit_req zone=api_limit burst=20 nodelay;
        set $auth_ok 0;
        if ($valid_api_key = 1) { set $auth_ok 1; }
        if ($has_bearer = 1) { set $auth_ok 1; }
        if ($auth_ok = 0) {
            return 401 '{"error":"Unauthorized","message":"Sertakan header X-API-Key atau Authorization Bearer token"}';
        }

        rewrite ^/api/v1/crowd-reports(.*)$ /api/collections/crowd_reports/records$1 break;
        proxy_pass http://transit-service:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
